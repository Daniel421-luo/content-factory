name: 🎯 科技ETF盘前/开盘信号推送

permissions:
  contents: write

on:
  schedule:
    # 北京时间 21:00（UTC 13:00）→ 盘前决策底稿（美股 21:30 开盘前 30 分钟）
    - cron: '0 13 * * 1-5'
    - cron: '5 13 * * 1-5'    # 冗余，防漏跑
    # 北京时间 22:05（UTC 14:05）→ 开盘半小时信号（21:30 开盘后 35 分钟）
    - cron: '5 14 * * 1-5'
    - cron: '15 14 * * 1-5'   # 冗余，防漏跑
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        type: choice
        options:
          - auto
          - premarket
          - open30

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 判断时段（北京）
        id: slot
        run: |
          HOUR=$(TZ='Asia/Shanghai' date +%H)
          MIN=$(TZ='Asia/Shanghai' date +%M)
          NOW_MIN=$((10#$HOUR * 60 + 10#$MIN))

          if [ "${{ inputs.mode }}" = "premarket" ]; then
            MODE="premarket"
          elif [ "${{ inputs.mode }}" = "open30" ]; then
            MODE="open30"
          elif [ "$NOW_MIN" -ge 1310 ]; then
            MODE="open30"           # 晚于 21:10 一律判为开盘后
          else
            MODE="premarket"
          fi

          echo "mode=${MODE}" >> $GITHUB_OUTPUT
          echo "🎯 本趟信号: ${MODE} (北京 $(TZ='Asia/Shanghai' date +%H:%M))"

      - name: 运行信号引擎
        id: engine
        run: |
          python .github/scripts/tech-etf-signal.py ${{ steps.slot.outputs.mode }} > /tmp/report.md
          cat /tmp/report.md

      - name: 📱 Bark 推送 (直推 iPhone)
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          MODE="${{ steps.slot.outputs.mode }}"
          if [ "$MODE" = "premarket" ]; then
            EMOJI="🌙"; PREFIX="盘前决策"
          else
            EMOJI="⚡"; PREFIX="开盘信号"
          fi
          # 标题 = 第一行（去掉 emoji/装饰）
          HEADLINE=$(head -1 /tmp/report.md | sed 's/🌙 //; s/⚡ //' | head -c 120)
          curl -s -o /dev/null -w "%{http_code}" "https://api.day.app/${BARK_KEY}/${EMOJI}%20${PREFIX}/${HEADLINE}?group=%E7%A7%91%E6%8A%80ETF"
          echo ""
          echo "✅ Bark 已推送: ${EMOJI} ${PREFIX}"

      - name: 💬 飞书消息推送 (直推手机)
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_OPEN_ID: ${{ secrets.FEISHU_OPEN_ID }}
        run: |
          MODE="${{ steps.slot.outputs.mode }}"
          if [ "$MODE" = "premarket" ]; then
            EMOJI="🌙"; PREFIX="盘前决策"
          else
            EMOJI="⚡"; PREFIX="开盘信号"
          fi
          BODY=$(cat /tmp/report.md)
          python3 - "$EMOJI" "$PREFIX" "$BODY" << 'PYEOF'
          import json, os, requests, sys
          _, emoji, prefix, body = sys.argv
          r = requests.post("https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              json={"app_id": os.environ["FEISHU_APP_ID"], "app_secret": os.environ["FEISHU_APP_SECRET"]}, timeout=10)
          token = r.json()["tenant_access_token"]
          msg = f"{emoji} {prefix}\n{body}"
          r = requests.post("https://open.feishu.cn/open-apis/im/v1/messages",
              params={"receive_id_type": "open_id"},
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              json={"receive_id": os.environ["FEISHU_OPEN_ID"], "msg_type": "text",
                    "content": json.dumps({"text": msg})}, timeout=10)
          data = r.json()
          print("✅ 飞书已推送" if data.get("code") == 0 else f"❌ 飞书失败: {data}")
          PYEOF

      - name: Git 提交存档
        run: |
          git config user.name "科技ETF信号机器人"
          git config user.email "bot@content-factory.local"
          MODE="${{ steps.slot.outputs.mode }}"
          D=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          H=$(TZ='Asia/Shanghai' date +%H%M)
          mkdir -p 信号/
          cp /tmp/report.md "信号/科技ETF-${MODE}-${D}-${H}.md"
          git add -A 信号/
          git commit -m "🎯 科技ETF信号 $D [$MODE]" || echo "⏭️ Nothing to commit"
          git pull --rebase origin main --no-edit
          git push

      - name: 汇总状态
        if: always()
        run: |
          echo "📊 信号任务完成: ${{ steps.slot.outputs.mode }} (北京 $(TZ='Asia/Shanghai' date +%H:%M))"
