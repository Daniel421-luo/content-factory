name: 🎯 科技ETF盘前/开盘信号推送

permissions:
  contents: write

on:
  schedule:
    # 北京时间 20:55（UTC 12:55）→ 盘前决策底稿（美股 21:30 开盘前 35 分钟）
    # 提前 5 分钟 + 冗余一条，补偿 GitHub Actions cron 约 5 分钟天然延迟，
    # 确保 Daniel 21:00 前稳定收到（只保留盘前决策，开盘半小时已废弃）。
    - cron: '55 12 * * 1-5'
    - cron: '58 12 * * 1-5'   # 冗余，防漏跑
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        type: choice
        options:
          - premarket

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 判断模式（仅盘前决策）
        id: slot
        run: |
          # 只保留盘前决策模式，固定 premarket，不再按时段分流
          MODE="premarket"
          echo "mode=${MODE}" >> $GITHUB_OUTPUT
          echo "🎯 本趟信号: ${MODE} (北京 $(TZ='Asia/Shanghai' date +%H:%M))"

      - name: 运行信号引擎
        id: engine
        run: |
          python .github/scripts/tech-etf-signal.py ${{ steps.slot.outputs.mode }} > /tmp/report.md
          cat /tmp/report.md

      - name: 📱 Bark 推送 (直推 iPhone)
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          EMOJI="🌙"; PREFIX="盘前决策"
          # 标题 = 第一行（去掉 emoji/装饰）
          HEADLINE=$(head -1 /tmp/report.md | sed 's/🌙 //; s/⚡ //' | head -c 120)
          python3 - "$EMOJI" "$PREFIX" "$HEADLINE" << 'PYEOF'
          import os, sys, urllib.parse
          emoji, prefix, headline = sys.argv[1], sys.argv[2], sys.argv[3]
          key = os.environ["BARK_KEY"]
          path = f"{emoji} {prefix}/{headline}"
          url = f"https://api.day.app/{key}/" + urllib.parse.quote(path) + "?group=" + urllib.parse.quote("科技ETF")
          import requests
          r = requests.get(url, timeout=20)
          print(f"Bark HTTP {r.status_code}")
          print("✅ Bark 已推送" if r.status_code == 200 else f"❌ Bark 失败: {r.text[:100]}")
          PYEOF

      - name: 💬 飞书消息推送 (直推手机)
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_OPEN_ID: ${{ secrets.FEISHU_OPEN_ID }}
        run: |
          EMOJI="🌙"; PREFIX="盘前决策"
          BODY=$(cat /tmp/report.md)
          python3 - "$EMOJI" "$PREFIX" "$BODY" << 'PYEOF'
          import json, os, requests, sys
          _, emoji, prefix, body = sys.argv
          r = requests.post("https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              json={"app_id": os.environ["FEISHU_APP_ID"], "app_secret": os.environ["FEISHU_APP_SECRET"]}, timeout=10)
          token = r.json()["tenant_access_token"]
          msg = f"{emoji} {prefix}\n{body}"
          r = requests.post("https://open.feishu.cn/open-apis/im/v1/messages",
              params={"receive_id_type": "open_id"},
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              json={"receive_id": os.environ["FEISHU_OPEN_ID"], "msg_type": "text",
                    "content": json.dumps({"text": msg})}, timeout=10)
          data = r.json()
          print("✅ 飞书已推送" if data.get("code") == 0 else f"❌ 飞书失败: {data}")
          PYEOF

      - name: Git 提交存档
        run: |
          git config user.name "科技ETF信号机器人"
          git config user.email "bot@content-factory.local"
          MODE="${{ steps.slot.outputs.mode }}"
          D=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          H=$(TZ='Asia/Shanghai' date +%H%M)
          mkdir -p 信号/
          cp /tmp/report.md "信号/科技ETF-${MODE}-${D}-${H}.md"
          git add -A 信号/
          git commit -m "🎯 科技ETF信号 $D [$MODE]" || echo "⏭️ Nothing to commit"
          git pull --rebase origin main --no-edit
          git push

      - name: 汇总状态
        if: always()
        run: |
          echo "📊 信号任务完成: ${{ steps.slot.outputs.mode }} (北京 $(TZ='Asia/Shanghai' date +%H:%M))"
