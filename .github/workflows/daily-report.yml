name: 📰 两报自动生成

permissions:
  contents: write

on:
  schedule:
    # 主 cron（2 个时段）+ 冗余 cron（防 GitHub 漏跑）
    - cron: '0 0 * * *'     # UTC 00:00 → 北京 08:00 → 🤖 晨报·AI
    - cron: '0 4 * * *'     # UTC 04:00 → 北京 12:00 → 🔄 补报检查（AI 没跑则补）
    - cron: '0 10 * * *'    # UTC 10:00 → 北京 18:00 → 🌙 晚报（市场+全球）
    - cron: '30 10 * * 1-5' # UTC 10:30 → 北京 18:30 → 🌙 冗余（仅交易日，防 18:00 漏跑）
    - cron: '0 11 * * *'    # UTC 11:00 → 北京 19:00 → 🔄 最终补报（兜底）
  workflow_dispatch:
    inputs:
      report_type:
        description: '日报类型'
        required: true
        type: choice
        options:
          - ai
          - evening

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 判断时段 + 补报检查
        id: slot
        run: |
          HOUR=$(TZ='Asia/Shanghai' date +%H)
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)

          # 检查今天已生成的报告
          AI_EXISTS=$([ -f "日报/AI日报-${TODAY}.md" ] && echo 1 || echo 0)
          EVE_EXISTS=$([ -f "日报/晚报-${TODAY}.md" ] && echo 1 || echo 0)

          echo "📊 已有报告: AI=$AI_EXISTS 晚报=$EVE_EXISTS (北京时间 ${HOUR}:00)"

          if [ "${{ inputs.report_type }}" != "" ]; then
            # 手动触发 — 使用传入的类型
            TYPE="${{ inputs.report_type }}"
          elif [ "$HOUR" -ge 8 ] && [ "$HOUR" -lt 18 ] && [ "$AI_EXISTS" -eq 0 ]; then
            TYPE="ai"                                    # 🔄 补报：AI 8点该跑没跑
          elif [ "$HOUR" -ge 18 ] && [ "$EVE_EXISTS" -eq 0 ]; then
            TYPE="evening"                               # 🔄 补报：晚报 18 点该跑没跑
          elif [ "$HOUR" -lt 12 ]; then
            TYPE="ai"
          else
            TYPE="evening"
          fi

          # 如果该类型今天已有报告，跳过
          case "$TYPE" in
            ai)      [ "$AI_EXISTS" -eq 1 ]  && echo "⏭️ AI 日报今天已有，跳过" && TYPE="skip" ;;
            evening) [ "$EVE_EXISTS" -eq 1 ] && echo "⏭️ 晚报今天已有，跳过"   && TYPE="skip" ;;
          esac

          echo "type=${TYPE}" >> $GITHUB_OUTPUT

          # 计算时间上下文
          ET_TODAY=$(TZ='America/New_York' date +%m/%d)
          ET_YESTERDAY=$(TZ='America/New_York' date -d 'yesterday' +%m/%d)
          BJT_NOW=$(TZ='Asia/Shanghai' date +%m/%d\ %H:%M)
          case "$TYPE" in
            ai)      TIME_CONTEXT="📅 截至 ${BJT_NOW} 北京时间" ;;
            evening) TIME_CONTEXT="📅 截至 ${BJT_NOW} 北京时间 · 美股 ${ET_YESTERDAY} 收盘" ;;
            skip)    TIME_CONTEXT="" ;;
          esac
          echo "time_context=${TIME_CONTEXT}" >> $GITHUB_OUTPUT

          echo "🎯 本趟任务: ${TYPE}"

      - name: 采集 & DeepSeek炼油 & 存储
        if: steps.slot.outputs.type != 'skip'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPORT_TYPE: ${{ steps.slot.outputs.type }}
        run: python .github/scripts/daily-report.py

      - name: 📱 Bark 推送 (直推 iPhone)
        if: steps.slot.outputs.type != 'skip'
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TIME_CONTEXT: ${{ steps.slot.outputs.time_context }}
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          case "${{ steps.slot.outputs.type }}" in
            ai)         PREFIX="AI日报";   EMOJI="🤖" ;;
            evening)    PREFIX="晚报";     EMOJI="🌙" ;;
          esac
          FILE="日报/${PREFIX}-${TODAY}.md"
          BODY=$(python3 .github/scripts/extract-topics.py "$FILE" bark | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read()))")
          curl -s -o /dev/null -w "%{http_code}" "https://api.day.app/${BARK_KEY}/${EMOJI}%20${PREFIX}/${BODY}?group=%E6%97%A5%E6%8A%A5" || true
          echo ""
          echo "✅ Bark 已推送: ${EMOJI} ${PREFIX}"

      - name: 💬 飞书消息推送 (直推手机)
        if: steps.slot.outputs.type != 'skip'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_OPEN_ID: ${{ secrets.FEISHU_OPEN_ID }}
          TIME_CONTEXT: ${{ steps.slot.outputs.time_context }}
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          case "${{ steps.slot.outputs.type }}" in
            ai)         PREFIX="AI日报";   EMOJI="🤖" ;;
            evening)    PREFIX="晚报";     EMOJI="🌙" ;;
          esac
          FILE="日报/${PREFIX}-${TODAY}.md"
          TOPICS=$(python3 .github/scripts/extract-topics.py "$FILE" feishu)
          python3 - "$EMOJI" "$PREFIX" "$TODAY" "$TOPICS" << 'PYEOF'
          import json, os, requests, sys
          _, emoji, prefix, today, topics = sys.argv
          r = requests.post("https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              json={"app_id": os.environ["FEISHU_APP_ID"], "app_secret": os.environ["FEISHU_APP_SECRET"]}, timeout=10)
          token = r.json()["tenant_access_token"]
          msg = f"{emoji} {prefix} | {today}\n\n{topics}"
          r = requests.post("https://open.feishu.cn/open-apis/im/v1/messages",
              params={"receive_id_type": "open_id"},
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              json={"receive_id": os.environ["FEISHU_OPEN_ID"], "msg_type": "text",
                    "content": json.dumps({"text": msg})}, timeout=10)
          data = r.json()
          print("✅ 飞书已推送" if data.get("code") == 0 else f"❌ 飞书失败: {data}")
          PYEOF

      - name: Git 提交
        if: steps.slot.outputs.type != 'skip'
        run: |
          git config user.name "AI日报机器人"
          git config user.email "bot@content-factory.local"
          mkdir -p 日报/
          git add -A 日报/
          git commit -m "🤖 自动日报 $(TZ='Asia/Shanghai' date +%Y-%m-%d) [${{ steps.slot.outputs.type }}]" || echo "⏭️ Nothing to commit"
          git pull --rebase origin main --no-edit
          git push

      - name: 汇总状态
        if: always()
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          echo "📊 今日报告状态 ($TODAY):"
          [ -f "日报/AI日报-${TODAY}.md" ]  && echo "  ✅ 晨报·AI"    || echo "  ❌ 晨报·AI 缺失"
          [ -f "日报/晚报-${TODAY}.md" ]    && echo "  ✅ 晚报"        || echo "  ❌ 晚报 缺失"
